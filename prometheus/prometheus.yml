global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node_exporter
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: postgres_exporter
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: redis_exporter
    static_configs:
      - targets: ["redis_exporter:9121"]

  - job_name: etcd
    metrics_path: /metrics
    static_configs:
      - targets: ["etcd:2379"]

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]

  - job_name: promtail
    metrics_path: /metrics
    static_configs:
      - targets: ["promtail:9080"]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: seaweedfs-master
    static_configs:
      - targets: ["seaweedfs-master:9324"]

  - job_name: seaweedfs-volume
    static_configs:
      - targets: ["seaweedfs-volume:9325"]

  - job_name: seaweedfs-filer
    static_configs:
      - targets: ["seaweedfs-filer:9326"]

  - job_name: uptime_kuma
    metrics_path: /metrics
    basic_auth:
      password_file: /etc/prometheus/uptime_kuma.key
    static_configs:
      - targets: ["uptime-kuma:3001"]

  - job_name: kafka_exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: jenkins
    metrics_path: /prometheus/
    static_configs:
      - targets: ["jenkins:8085"]

  - job_name: zot
    metrics_path: /metrics
    static_configs:
      - targets: ["zot:5000"]
